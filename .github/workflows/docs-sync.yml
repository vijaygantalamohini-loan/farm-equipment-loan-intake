name: Docs Sync Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Docs sync check
        run: python scripts/check_docs_sync.py
